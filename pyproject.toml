[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-swap-component-attribution"
version = "0.1.0"
description = "Gold-swap component attribution: replace each component with its ideal version and measure what it could win, with ceiling shares, a fix order, and masking detection."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
